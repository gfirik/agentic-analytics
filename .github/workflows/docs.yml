name: docs

# Builds the docs site on every PR and push; deploys it to GitHub Pages from main (Settings → Pages → Source: GitHub Actions).
# Pages needs a public repo on the Free plan: while the repo is private the upload and deploy are skipped, not failed.
# workflow_dispatch redeploys main by hand (a re-run reuses the old event, including its private flag).
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR builds cancel each other; runs on main never cancel one that is deploying (the next one queues).
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run --filter @agentic-analytics/docs build
      - if: github.event_name != 'pull_request' && !github.event.repository.private && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    # One deploy at a time, never cancelled half-way (builds above still cancel each other).
    concurrency:
      group: pages
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && !github.event.repository.private && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
