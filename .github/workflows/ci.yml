name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Bun is the package manager (D14); Node 22 is the runtime (D7).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: doctor smoke (no models or services expected in CI)
        run: bun run aa doctor
      - name: compose file is valid
        run: docker compose config --quiet

  readme-browser:
    # README asset checks in a real browser (docs/DOCS-SITE.md §3): hero motion, <picture> variants, citation click.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # The runner's Ubuntu mirror sometimes stalls apt for ten minutes or more (three site-browser runs on
      # 2026-10-22 hit the job timeout inside this step, not in the tests): apt gives up on a silent connection after
      # 20s and moves on, a failed install is tried again, and the step is capped so it cannot eat the job.
      - name: Install Chromium and its system libraries
        timeout-minutes: 9
        run: |
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          for attempt in 1 2 3; do
            bunx playwright install --with-deps chromium && exit 0
            echo "playwright install attempt $attempt failed; retrying"
          done
          exit 1
      - run: bun run readme:check:browser

  site-browser:
    # The product site in a real browser (apps/docs/DESIGN.md §10): no third-party requests, axe WCAG 2 A/AA in light
    # and dark, no horizontal scroll at 360 px, JS-off and reduced-motion behaviour, favicons, OG image and sitemap.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # The runner's Ubuntu mirror sometimes stalls apt for ten minutes or more (three site-browser runs on
      # 2026-10-22 hit the job timeout inside this step, not in the tests): apt gives up on a silent connection after
      # 20s and moves on, a failed install is tried again, and the step is capped so it cannot eat the job.
      - name: Install Chromium and its system libraries
        timeout-minutes: 9
        run: |
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          for attempt in 1 2 3; do
            bunx playwright install --with-deps chromium && exit 0
            echo "playwright install attempt $attempt failed; retrying"
          done
          exit 1
      - run: bun run --filter @agentic-analytics/docs build
      - run: bun run site:check:browser
