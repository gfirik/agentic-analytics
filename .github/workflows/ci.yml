name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI checks code and needs no write access (the other workflows set theirs too).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Bun is the package manager (D14); Node 22 is the runtime (D7).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: doctor smoke (no models or services expected in CI)
        run: bun run aa doctor
      - name: compose file is valid
        run: docker compose config --quiet

  readme-browser:
    # README asset checks in a real browser (docs/DOCS-SITE.md §3): hero motion, <picture> variants, citation click.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PW_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The runner's own Google Chrome, not Playwright's Chromium: `playwright install --with-deps` pulls system
      # packages from the runner's Ubuntu mirror, which on 2026-10-22/23 stalled or crawled at ~40 KB/s and timed the
      # job out four times (apt timeouts and retries didn't help: it was slow, not silent). The image ships Chrome and
      # its libraries; locally the suites run the same way (PW_CHANNEL=chrome).
      - name: Use the runner's Chrome
        run: google-chrome --version
      - run: bun run readme:check:browser

  site-browser:
    # The product site in a real browser (apps/docs/DESIGN.md §10): no third-party requests, axe WCAG 2 A/AA in light
    # and dark, no horizontal scroll at 360 px, JS-off and reduced-motion behaviour, favicons, OG image and sitemap.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PW_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The runner's own Google Chrome, not Playwright's Chromium: `playwright install --with-deps` pulls system
      # packages from the runner's Ubuntu mirror, which on 2026-10-22/23 stalled or crawled at ~40 KB/s and timed the
      # job out four times (apt timeouts and retries didn't help: it was slow, not silent). The image ships Chrome and
      # its libraries; locally the suites run the same way (PW_CHANNEL=chrome).
      - name: Use the runner's Chrome
        run: google-chrome --version
      - run: bun run --filter @agentic-analytics/docs build
      - run: bun run site:check:browser
