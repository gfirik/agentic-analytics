# `docker compose up` starts the engine (API, viewer and MCP on :8080); profiles add optional free services:
#   --profile web      SearXNG on :8888
#   --profile docling  docling-serve on :5001
#   --profile ollama   Ollama on :11434 (skip if Ollama is installed natively)
services:
  engine:
    build:
      context: .
      dockerfile: docker/engine.Dockerfile
    ports:
      # Localhost only: the API has no auth unless API_TOKEN is set.
      - "127.0.0.1:${PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      SEARXNG_URL: http://searxng:8080
      DOCLING_URL: http://docling:5001
    volumes:
      - ./data:/data

  searxng:
    image: searxng/searxng:latest
    profiles: ["web"]
    ports:
      - "8888:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    volumes:
      # Enables the JSON API the engine uses (SearXNG ships with it off).
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro

  docling:
    image: quay.io/docling-project/docling-serve:latest
    profiles: ["docling"]
    ports:
      - "5001:5001"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
