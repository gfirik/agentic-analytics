# Retrieval eval set (docs/specs/retrieval.md §5). Each question lists its relevant passages as
# (file, text the chunk must contain). recall@8 = share of relevant passages found in the top 8;
# MRR = 1 / rank of the first relevant hit; answer-in-context = a relevant passage is in the top 8.
# Wording deliberately paraphrases the sources so that pure keyword match is not enough.

corpora:
  coffee-roaster-v1:
    dir: evals/datasets/coffee-roaster-v1/files
    questions:
      - q: Why did the hotel stop its standing order?
        relevant:
          - { file: email-0412.eml, contains: "pausing our standing order" }
      - q: When did wholesale prices go up and by how much?
        relevant:
          - { file: price-list.pdf, contains: "Wholesale prices increase 12%" }
      - q: Did anything change with packaging suppliers?
        relevant:
          - { file: ops-notes.docx, contains: "new packaging supplier" }
      - q: How long do customers have to pay invoices?
        relevant:
          - { file: price-list.pdf, contains: "due within 14 days" }
      - q: What is the minimum wholesale order?
        relevant:
          - { file: price-list.pdf, contains: "Minimum order: 10 kg" }
      - q: Was there any equipment downtime?
        relevant:
          - { file: ops-notes.docx, contains: "Grinder serviced" }

