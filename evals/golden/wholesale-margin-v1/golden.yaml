# Golden set, dev split (docs/specs/accuracy.md §1–§4, M15 PR 3b): the synthetic wholesale-margin-v1 invoice lines
# (evals/datasets/wholesale-margin-v1/files/invoice-lines.csv), built to prove the margin pack. FILE in each `sql` stands
# for that file, read with all_varchar so no type guess applies. Revenue is Σ Net Amount, cost is Σ Qty × Std cost.
# The expected figures are the dataset's expectations.yaml. Written before any M15 engine code; their `fact` labels are
# those of analysis-library §14. Agent-reviewed (2026-10-23): a separate subagent re-derived each answer blind and
# agrees; not yet maintainer-reviewed (accuracy.md §3).
dataset: wholesale-margin-v1
items:
  - id: G1
    capability: margin
    question: What was gross margin (net sales minus quantity × standard cost over all lines) in March 2026, in GBP?
    kind: numeric
    expected: 14172.4
    tolerance: { abs: 0.01 }
    source: { kind: fact, label: gross_margin_2026-03 }
    columns: ["Invoice Date", "Qty", "Std cost", "Net Amount"]
    sql: >-
      SELECT round(sum("Net Amount"::DOUBLE) - sum("Qty"::DOUBLE * "Std cost"::DOUBLE), 2)
      FROM read_csv('FILE', all_varchar = true) WHERE left("Invoice Date", 7) = '2026-03'
    split: dev
    review: { reviewed_by: agent (autonomous mode), date: 2026-10-23, method: independent_sql, agrees: true }
  - id: G2
    capability: margin
    question: What was the gross margin percentage (gross margin divided by net sales) in June 2026, the latest month, in percent?
    kind: numeric
    expected: 25.1904
    tolerance: { abs: 0.001 }
    source: { kind: fact, label: gross_margin_pct_2026-06 }
    columns: ["Invoice Date", "Qty", "Std cost", "Net Amount"]
    sql: >-
      SELECT round(100 * (1 - sum("Qty"::DOUBLE * "Std cost"::DOUBLE) / sum("Net Amount"::DOUBLE)), 4)
      FROM read_csv('FILE', all_varchar = true) WHERE left("Invoice Date", 7) = '2026-06'
    split: dev
    review: { reviewed_by: agent (autonomous mode), date: 2026-10-23, method: independent_sql, agrees: true }
  - id: G3
    capability: margin
    question: >-
      Of the change in gross margin from February to March 2026, how much came from unit costs rising (the cost effect:
      minus the sum over products of March units × (March standard cost − February standard cost)), in GBP?
    kind: numeric
    expected: -1902
    tolerance: { abs: 0.01 }
    source: { kind: fact, label: pvm_margin.cost_2026-03 }
    columns: ["Invoice Date", SKU, "Qty", "Std cost"]
    sql: >-
      WITH m AS (SELECT left("Invoice Date", 7) AS mo, SKU, sum(Qty::DOUBLE) AS q, max("Std cost"::DOUBLE) AS c
                 FROM read_csv('FILE', all_varchar = true) GROUP BY 1, 2)
      SELECT round(-sum(a.q * (a.c - b.c)), 4) FROM m a JOIN m b ON a.SKU = b.SKU AND b.mo = '2026-02' WHERE a.mo = '2026-03'
    split: dev
    review: { reviewed_by: agent (autonomous mode), date: 2026-10-23, method: independent_sql, agrees: true }
